# Maven
# Build your Java project and run tests with Apache Maven.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/java

trigger:
- feature-test-pipeline-cucumber

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Build
    displayName: "Build Stage"
    jobs:
      - job: BuildJob
        steps:
          - script: echo ">>> Running Build Stage..."
            displayName: "Print Build message"

  - stage: Test
    displayName: "Test Stage"
    dependsOn: Build
    jobs:
      - job: TestJob
        steps:
          - script: echo ">>> Running Test Stage..."
            displayName: "Print Test message"

  - stage: Deploy
    displayName: "Deploy Stage"
    dependsOn: Test
    jobs:
      - job: DeployJob
        steps:
          - script: echo ">>> Running Deploy Stage..."
            displayName: "Print Deploy message"

          # Example: sending a file from the repo to server via API
          - script: |
              echo ">>> Uploading results.json to server..."
              curl -X POST "https://yourserver.com/api/upload" \
                   -H "Authorization: Bearer $(API_TOKEN)" \
                   -F "file=@./results.json"
            displayName: "Upload file to server"
